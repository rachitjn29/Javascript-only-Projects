<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Clock</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <div class="clock">

            <div class="time">
                <p id="hrs">00</p>
                <span>Hours</span>
            </div>

            <p class="colon">:</p>

            <div class="time">
                <p id="min">00</p>
                <span>Minutes</span>
            </div>

            <p class="colon">:</p>

            <div class="time">
                <p id="sec">00</p>
                <span>Seconds</span>
            </div>

            <div class="time ampm">
                <p id="period">AM</p>
                <span>Period</span>
            </div>

        </div>
    </div>

    <script src="script.js"></script>

</body>
</html>
