<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Tic Tac Toe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Tic Tac Toe</h1>
    <p class="turn">Turn : <span id="turn">-</span></p>

    <div class="board" id="board">
      <div class="line" id="line"></div>
      <button class="cell" data-index="0" disabled></button>
      <button class="cell" data-index="1" disabled></button>
      <button class="cell" data-index="2" disabled></button>

      <button class="cell" data-index="3" disabled></button>
      <button class="cell" data-index="4" disabled></button>
      <button class="cell" data-index="5" disabled></button>

      <button class="cell" data-index="6" disabled></button>
      <button class="cell" data-index="7" disabled></button>
      <button class="cell" data-index="8" disabled></button>
    </div>

    <h2 id="result"></h2>

    <div class="buttons">
      <button id="gameBtn">Start Game</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
