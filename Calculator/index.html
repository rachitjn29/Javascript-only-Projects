<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<section class="calculator">
    <input type="text" placeholder="0" id="input-box">
    <div class="buttons">
    <button class="special allclear">A/C</button>
    <button class="special del">DEL</button>
    <button class="special tax">TAX</button>
    <button class="special pi">PI</button>

    <button class="advanced root">√</button>
    <button class="advanced square">x²</button>
    <button class="advanced plusminus">+/-</button>
    <button class="operator">/</button>

    <button class="number">7</button>
    <button class="number">8</button>
    <button class="number">9</button>
    <button class="operator">*</button>

    <button class="number">4</button>
    <button class="number">5</button>
    <button class="number">6</button>
    <button class="operator">-</button>

    <button class="number">1</button>
    <button class="number">2</button>
    <button class="number">3</button>
    <button class="operator">+</button>

    <button class="number">00</button>
    <button class="number">0</button>
    <button class="decimal">.</button>
    <button class="equal">=</button>
    </div>
    <div class="footer">
        <H1>Calculator</H1>
    </div>
</section>
    <script src="script.js"></script>
</body>
</html>
